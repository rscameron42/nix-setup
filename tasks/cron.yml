# Self-updating cron job via ansible-pull — Linux only
# Runs as root so it can write to /var/log/ and has privileges for all playbook tasks.
# On macOS, use launchd or run ansible-pull manually.

- name: create ansible-pull log file
  file:
    path: /var/log/ansible-pull.log
    owner: root
    group: root
    mode: "0644"
    state: touch
  become: true
  changed_when: false
  when: ansible_facts['os_family'] != "Darwin"

- name: install ansible-pull cron job
  cron:
    user: root
    name: "ansible provision"
    minute: "*/10"
    job: "/usr/bin/ansible-pull -o -U https://github.com/rscameron42/nix-setup.git >> /var/log/ansible-pull.log 2>&1"
  become: true
  when: ansible_facts['os_family'] != "Darwin"
