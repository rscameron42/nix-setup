- name: set zsh as default shell for target user (Linux)
  user:
    name: "{{ target_user }}"
    shell: /usr/bin/zsh
  become: true
  when: ansible_facts['os_family'] != "Darwin"

- name: set zsh as default shell for target user (macOS)
  user:
    name: "{{ target_user }}"
    shell: /bin/zsh
  become: true
  when: ansible_facts['os_family'] == "Darwin"
