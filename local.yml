- hosts: localhost
  connection: local

  vars:
    target_user: ron
    target_home: "{{ '/Users' if ansible_facts['os_family'] == 'Darwin' else '/home' }}/{{ target_user }}"

  pre_tasks:
    - name: update apt repositories (Debian/Ubuntu only)
      apt:
        update_cache: yes
      changed_when: False
      become: true
      when: ansible_facts['pkg_mgr'] == "apt"

  tasks:
    - include_tasks: tasks/packages.yml
    - include_tasks: tasks/users.yml
    - include_tasks: tasks/dotfiles.yml
    - include_tasks: tasks/shell.yml
    - include_tasks: tasks/cron.yml
